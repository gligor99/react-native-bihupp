name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** include real account numbers, tax IDs or other personal data — use placeholder values.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code that reproduces the issue (input params or the BIHUPP10 payload string).
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: react-native-bihupp version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Expo Go
        - Expo development build
        - Bare React Native
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Expo SDK / React Native / react-native-svg versions
      placeholder: "Expo SDK 58, React Native 0.88, react-native-svg 15.16"
    validations:
      required: true
  - type: dropdown
    id: bank
    attributes:
      label: Is this about a bank rejecting the generated QR code?
      options:
        - "No"
        - "Yes"
  - type: input
    id: bank_name
    attributes:
      label: Bank / app name (if applicable)
