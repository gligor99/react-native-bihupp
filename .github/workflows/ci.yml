name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches breakage from new Expo / React Native releases
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn test --maxWorkers=2 --coverage

  build-library:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn prepare
      - run: yarn lint:pkg

  build-example:
    name: Build example (web, iOS, Android bundles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn example expo export --platform all --output-dir dist

  expo-compat:
    name: Expo SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [57, 58]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/sdk-compat.sh ${{ matrix.sdk }} "$RUNNER_TEMP/compat"
